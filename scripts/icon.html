<!doctype html>
<html>
  <head>

      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      svg {
        display: block;
      }
    </style>

        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4C0E92" />
          <stop offset="0.55" stop-color="#6D28D9" />
          <stop offset="1" stop-color="#9B6BF0" />
        </linearGradient>
      </defs>
      <rect id="bg" width="512" height="512" rx="112" fill="url(#g)" />
      <text
        id="emoji"
        x="256"
        y="342"
        font-size="264"
        text-anchor="middle"
        font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif"

</html>
